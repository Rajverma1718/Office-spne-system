{% extends "authentication/root.html" %}
{% load static %}

{% block title %} Leave {% endblock title %}

{% block head %}
<style>

/* MAIN */
.main-content {
    padding: 10px;
}

/* HEADING */
.main-content h2 {
    margin-bottom: 20px;
    font-size: 20px;
    color: #ffffff;
}

/* LINK RESET */
.main-content a {
    text-decoration: none;
    color: inherit;
}

/* 🔥 GLASS CARD */
.menu-item {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    margin-bottom: 15px;
    border-radius: 16px;

    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow: 
        0 8px 20px rgba(0,0,0,0.4);

    transition: all 0.3s ease;
}

/* HOVER */
.menu-item:hover {
    transform: translateY(-3px) scale(1.01);
    background: rgba(255,255,255,0.1);
}

/* ICON */
.menu-item i {
    font-size: 18px;
    margin-right: 12px;

    background: linear-gradient(135deg, #f6d365, #fda085);
    color: #222;

    width: 40px;
    height: 40px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

/* TEXT */
.menu-item span {
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
}

/* MOBILE */
@media (max-width: 480px) {

    .main-content h2 {
        font-size: 18px;
    }

    .menu-item {
        padding: 12px;
    }

    .menu-item span {
        font-size: 13px;
    }
}

</style>
{% endblock head %}

{% block body %}

<div class="container">
    <div class="main-content">

        <h2>💰 Expense Dashboard</h2>

        <a href="{% url 'add_expense' %}" class="menu-item">
            <i class="fas fa-file-invoice-dollar"></i>
            <span>Add Expense</span>
        </a>

        <a href="{% url 'add_voucher' %}" class="menu-item">
            <i class="fas fa-plus-square"></i>
            <span>Add Voucher</span>
        </a>

        <a href="{% url 'recent_expenses' %}" class="menu-item">
            <i class="fas fa-clock"></i>
            <span>Recent Applications</span>
        </a>

        <a href="{% url 'approve_expenses' %}" class="menu-item">
            <i class="fas fa-check-circle"></i>
            <span>Approved Applications</span>
        </a>

        <a href="{% url 'reject_expenses' %}" class="menu-item">
            <i class="fas fa-times-circle"></i>
            <span>Rejected Applications</span>
        </a>

    </div>
</div>

{% endblock body %}
