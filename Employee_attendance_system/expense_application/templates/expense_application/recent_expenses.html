{% extends "authentication/root.html" %}

{% block head %}
<style>
/* SAME CSS — NO CHANGE */
.expense-card{
    display:flex;
    margin-bottom:15px;
    border-radius:6px;
    overflow:hidden;
    background:#e8dcc7;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.date-box{
    background:#c59b5f;
    color:white;
    width:70px;
    text-align:center;
    padding:10px 5px;
}
.day{
    font-size:22px;
    font-weight:bold;
}
.month{
    font-size:12px;
}
.details{
    padding:10px 12px;
    font-size:13px;
    flex:1;
    color: black;
}
.top-line{
    font-size:14px;
    margin-bottom:5px;
    color: gray;
    font-weight: bold;
}

.view-link{
    margin-top:5px;
    display:inline-block;
    color:#007bff;
    font-size:13px;
}
h2{
    text-align:center;
    margin-bottom:20px;
    color:white;
}
</style>
{% endblock %}


{% block body %}

<div class="container">

<h2>Recent Expenses</h2>

{% for m in monthly_data %}
<div class="expense-card">

    <!-- MONTH BOX -->
    <div class="date-box">
        <div class="day">{{ m.month|date:"M" }}</div>
        <div class="month">{{ m.month|date:"Y" }}</div>
    </div>

    <!-- DETAILS -->
    <div class="details">

        <div>
            Total Amount : <span class="top-line">₹ {{ m.total_amount }}</span> 
        </div>

        <!-- VIEW -->
        <a href="{% url 'monthly_detail' m.month.year m.month.month 'pending' %}" class="view-link">
            Pending
        </a>

    </div>

</div>
{% empty %}
<p>No expenses yet</p>
{% endfor %}

</div>

{% endblock %}
