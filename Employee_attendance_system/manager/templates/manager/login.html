<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Login - K Vishwakarma & Co</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-box {
      background: #fff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .login-box h3 {
      text-align: center;
      margin-bottom: 20px;
      color: red;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    form input {
      width: 100%;
      padding: 10px;
      border: none;
      border-bottom: 2px solid #0074a6;
      font-size: 16px;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #0074a6;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin-top: 25px;
      cursor: pointer;
    }

    .login-btn:hover {
      background-color: #005b84;
    }

    .extra-links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .extra-links a {
      text-decoration: none;
      color: #0074a6;
    }

    .error {
      color: red;
      margin-top: 10px;
      text-align: center;
    }

    .footer {
      font-size: 12px;
      color: gray;
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="login-container">
  <div class="login-box">
    <h2>Kunal Vishwakarma & Co</h2>
    <h3>Manager Login Page</h3>

    <form method="POST">
      {% csrf_token %}

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <button type="submit" class="login-btn">Login</button>

      <div class="extra-links">
        <a href="{% url 'user_login' %}">Click here for User Login</a>
      </div>
      
      <p class="footer">Developed by Kunal Technologies India Pvt. Ltd.</p>
    </form>

  </div>
</div>

</body>
</html>
