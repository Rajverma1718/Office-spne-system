<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Login - Nexvora Technologies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0074a6);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      backdrop-filter: blur(15px);
      transition: 0.5s;
    }

    .login-box:hover {
      transform: perspective(1000px) rotateX(3deg) scale(1.02);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .login-box h2 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 5px;
      color: #fff;
    }

    .login-box h3 {
      text-align: center;
      font-size: 16px;
      margin-bottom: 20px;
      color: #ffdd57;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ffdd57;
      box-shadow: 0 0 12px rgba(255,221,87,0.5);
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #ffdd57, #ffaa00);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin-top: 25px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .login-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 25px rgba(0,0,0,0.4);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: #ffdd57;
    }

    .forgot-link {
      text-decoration: none;
      color: #ffdd57;
      position: relative;
    }

    .forgot-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 2px;
      background: #ffdd57;
      transition: 0.3s;
    }

    .forgot-link:hover::after {
      width: 100%;
    }

    .extra-links {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .user-link {
      text-decoration: none;
      color: #ffdd57;
      position: relative;
      font-weight: 500;
    }

    .user-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 0%;
      height: 2px;
      background: #ffdd57;
      transition: 0.3s;
    }

    .user-link:hover::after {
      width: 100%;
    }

    .error {
      color: #ff6b6b;
      margin-top: 10px;
      text-align: center;
    }

    .footer {
      font-size: 12px;
      color: #ccc;
      margin-top: 20px;
      text-align: center;
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .login-box {
        padding: 25px 20px;
      }
      .login-box h2 { font-size: 20px; }
      input { font-size: 16px; }
      .login-btn { font-size: 17px; }
      .remember-forgot { font-size: 13px; }
    }

    /* TABLET */
    @media (max-width: 768px) {
      .login-box {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <h2>Nexvora Technologies</h2>
    <h3>Manager Login Page</h3>

    <form method="POST">
      {% csrf_token %}
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <button type="submit" class="login-btn">Login</button>

      <div class="remember-forgot">
        <label class="remember">
          <input type="checkbox" checked>
          <span>Remember Me</span>
        </label>

        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <div class="extra-links">
        <a href="{% url 'user_login' %}" class="user-link">
          Click here for User Login
        </a>
      </div>

      <p class="footer">Developed by Kunal Vishwakarma and Raj Verma.</p>
    </form>
  </div>
</div>

</body>
</html>
