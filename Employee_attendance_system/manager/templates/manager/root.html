<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>KV System | {% block title %}{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            background: linear-gradient(135deg, #0074a6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1000;
            
        }

        .header h1 {
            font-size: 18px;
            color: #ffdd57;
        }

        .header p {
            font-size: 13px;
            color: #fff;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 1200px;
            min-height: calc(100vh - 140px); 
            padding: 50px 5px 90px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            overflow-y: auto;
        }
            
                    

        /* FOOTER */
        .footer {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1000;
        }

        .footer-nav {
            display: flex;
            gap: 18px;
        }

        .footer-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }

        .footer-nav a i {
            font-size: 16px;
            margin-bottom: 3px;
        }

        .footer-nav a:hover {
            color: #ffdd57;
            transform: translateY(-3px) scale(1.05);
        }

        .logo {
            font-size: 12px;
            color: #fff;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 16px;
            }

            .header p {
                font-size: 12px;
            }

            .footer-nav {
                gap: 12px;
            }

            .footer-nav a {
                font-size: 11px;
            }

            .footer-nav a i {
                font-size: 14px;
            }

            .logo {
                display: none;
            }
        }
    </style>

    {% block head %}{% endblock head %}
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Nexvora Technologies</h1>
        <p>Welcome: {{ request.user.username }}</p>
    </header>

    <!-- BODY -->
    <div class="container">
        {% block body %}{% endblock body %}
    </div>

    <!-- BACK BUTTON BLOCK -->
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-nav">
            <a href="{% url 'manager_dashboard' %}">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <!-- <a href="{% url 'profile' %}">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a> -->
            <a href="{% url 'manager_logout' %}">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
        <div class="logo">
            <img src="{% static 'images/logo.png' %}" alt="Nexvora Logo" style="height:35px;">
        </div>
    </footer>

</body>
</html>
