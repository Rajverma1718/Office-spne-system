{% extends "manager/root.html" %}

{% block body %}

<style>
/* Full-screen dashboard container */


/* Dashboard title */
.dashboard-title {
    font-size: 32px;
    font-weight: bold;
    color: #ffdd57; /* Highlight color */
    text-align: center;
}

/* Card grid */
.card-grid {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    width: 95%;
}

/* Individual cards */
.dashboard-card {
    flex: 1 1 300px;
    background: rgba(255, 255, 255, 0.08); /* Glassmorphic effect */
    border-radius: 20px;
    text-align: center;
    padding: 30px 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    transition: 0.5s;
    color: #fff;
}

.dashboard-card:hover {
    transform: perspective(1000px) translateY(-5px) scale(1.02);
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
}

.dashboard-card h3 {
    font-size: 22px;
    margin-bottom: 15px;
    color: #ffdd57;
}

.dashboard-card p {
    font-size: 16px;
    margin-bottom: 25px;
    color: #fff;
}

/* Buttons */
.card-btn {
    margin-top: 10px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    color: white;
    background: linear-gradient(135deg, #ffdd57, #ffaa00);
}

.card-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* Responsive */
@media (max-width: 1024px) {
    .dashboard-container {
        padding: 30px 30px;
    }
    .dashboard-card {
        flex: 1 1 45%;
    }
}

@media (max-width: 768px) {
    .dashboard-container {
        padding: 0px 25px;
    }
    .dashboard-card {
        flex: 1 1 100%;
    }
}

@media (max-width: 480px) {
    .dashboard-title {
        font-size: 26px;
    }
    .dashboard-card h3 {
        font-size: 20px;
    }
    .dashboard-card p {
        font-size: 14px;
    }
    .card-btn {
        font-size: 14px;
        padding: 10px 20px;
    }
}
</style>

<div class="container">

    <div class="dashboard-title">👨‍💼 Manager Dashboard</div>

    <div class="card-grid">

        <!-- Swipe Requests -->
        <div class="dashboard-card">
            <h3>Swipe Requests</h3>
            <p>Approve / Reject employee swipe requests</p>
            <a href="{% url 'swipe_request' %}">
                <button class="card-btn">View Requests</button>
            </a>
        </div>

        <!-- Leave Requests -->
        <div class="dashboard-card">
            <h3>Leave Requests</h3>
            <p>Manage employee leave applications</p>
            <a href="{% url 'manager_leave_requests' %}">
            <button class="card-btn">View Requests</button>
            </a>
        </div>

        <!-- Expenses Requests -->
        <div class="dashboard-card">
            <h3>Expenses Requests</h3>
            <p>Manage employee expenses applications</p>
            <a href="{% url 'expense_request' %}">
            <button class="card-btn">View Requests</button>
            </a>
        </div>

        <!-- Attendance -->
        <div class="dashboard-card">
            <h3>Employee Data</h3>
            <p>View team activity</p>
            <a href="{% url 'employee_list' %}">
            <button class="card-btn">View</button>
            </a>
        </div>

    </div>

</div>

{% endblock %}
