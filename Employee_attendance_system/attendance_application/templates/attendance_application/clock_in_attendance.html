{% extends "authentication/root.html" %}
{% load static %}

{% block title %} Clock In {% endblock title %}

{% block head %}
<style>
    .main-content {
        padding: 50px;
    }

    h2 {
        margin-bottom: 5px;
    }

    .clockout-section {
        display: flex;
        margin-top: 20px;
        gap: 20px;
        flex-wrap: wrap;
    }

    .user-photo video,
    .user-photo img {
        width: 120px;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .remark-box {
        flex: 1;
    }

    textarea {
        width: 100%;
        height: 100px;
        resize: none;
        padding: 10px;
        font-size: 14px;
    }

    small {
        display: block;
        margin-top: 5px;
        color: gray;
    }

    .location {
        margin-top: 20px;
    }

    .select-fence {
        margin-top: 15px;
    }

    .select-fence select {
        padding: 5px;
        width: 100%;
        font-size: 16px;
    }

    .clockout-btn {
        margin-top: 20px;
        text-align: center;
    }

    .clockout-btn button {
        background-color: #0078d7;
        color: white;
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 50%;
        box-shadow: 0 0 10px #0078d7;
        cursor: pointer;
    }

    .capture-btn {
        margin-top: 10px;
    }
</style>
{% endblock head %}

{% block body %}
<div class="container" style="margin-top: 150px; margin-bottom: 100px;">
    <div class="main-content">
        <h2>Attendance</h2>
        <h3>Clock In</h3>

        <div class="clockout-section">
            <div class="user-photo">
                <video id="video" autoplay></video>
                <img id="snapshot" style="display:none;" />
                <div class="capture-btn">
                    <button onclick="takePhoto()">📸 Capture Photo</button>
                </div>
            </div>
            <div class="remark-box">
                <textarea id="remark" maxlength="100" placeholder="Remark for Clock In"></textarea>
                <small id="charCount">100 characters left</small>
            </div>
        </div>

        <div class="location">
            <h4>Location 📍</h4>
            <p id="location">Fetching location...</p>
        </div>

        <div class="select-fence">
            <label for="fence">Select fence *</label><br>
            <select id="fence">
                <option value="">--Select--</option>
                <option value="main">Main Gate</option>
                <option value="back">Back Gate</option>
            </select>
        </div>

        <div class="clockout-btn">
            <button onclick="clockIn()">CLOCK IN <span id="time"></span></button>
        </div>
    </div>
</div>

<script>
    // Live time
    function updateTime() {
        const now = new Date();
        document.getElementById("time").textContent = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Character count
    document.getElementById("remark").addEventListener("input", function () {
        const remaining = 100 - this.value.length;
        document.getElementById("charCount").textContent = `${remaining} characters left`;
    });

    // Camera
    const video = document.getElementById("video");
    const snapshot = document.getElementById("snapshot");
    let imageData = "";

    navigator.mediaDevices.getUserMedia({ video: true })
        .then((stream) => video.srcObject = stream)
        .catch((err) => alert("Camera access denied."));

    function takePhoto() {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        imageData = canvas.toDataURL("image/png");
        snapshot.src = imageData;
        snapshot.style.display = "block";
        video.style.display = "none";
    }

    // Location with reverse geocoding
    let currentLocation = "";
    let lat = 0;
    let lon = 0;

    function getLocation() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                lat = pos.coords.latitude;
                lon = pos.coords.longitude;
                currentLocation = `Latitude: ${lat.toFixed(5)}, Longitude: ${lon.toFixed(5)}`;
                document.getElementById("location").textContent = currentLocation;

                // Reverse geocode using OpenStreetMap
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                    const data = await response.json();
                    if (data && data.display_name) {
                        currentLocation += `\nAddress: ${data.display_name}`;
                        document.getElementById("location").textContent += `\nAddress: ${data.display_name}`;
                    }
                } catch (error) {
                    console.log("Reverse geocoding failed", error);
                }
            }, (err) => {
                document.getElementById("location").textContent = "Location access denied.";
            });
        } else {
            document.getElementById("location").textContent = "Geolocation not supported.";
        }
    }

    getLocation();

    // Submit to backend
    function clockIn() {
        const remark = document.getElementById("remark").value.trim();
        const fence = document.getElementById("fence").value;
        if (!fence) {
            alert("Please select a fence.");
            return;
        }

        fetch("{% url 'clock_in_attendance' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                remark,
                location: currentLocation,
                latitude: lat,
                longitude: lon,
                fence,
                photo: imageData
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'list_attendance') {
                window.location.href = "{% url 'list_attendance' %}";
            } else if (data.error) {
                alert(data.error);
            }
        })
        .catch(err => alert("Submission failed!"));
    }
</script>
{% endblock body %}
