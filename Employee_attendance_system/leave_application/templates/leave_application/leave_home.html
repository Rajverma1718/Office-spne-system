{% extends "authentication/root.html" %}
{% load static %}


{% block title %} Leave Menu {% endblock title %}


{% block head %}
<style>
    .main-content {
        padding: 20px;
    }

    .main-content h3 {
        margin-bottom: 15px;
    }

    .menu-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .menu-box a{
        text-decoration: none;
        color: black;
    }

    .menu-item {
        display: flex;
        align-items: center;
        gap: 15px;
        background-color: #e5e5e5;
        padding: 12px;
        font-size: 16px;
        border-left: 8px solid #01677b;
        cursor: pointer;
    }

    .menu-item i {
        background-color: #01677b;
        color: white;
        padding: 10px;
        border-radius: 5px;
    }
</style>
{% endblock head %}


{% block body %}

<div class="container" style="margin-top: 150px; margin-bottom: 100px;">
    <div class="main-content">
        <h2>Leave</h2>
        <div class="menu-box">

            <a href="{% url 'leave_apply' %}" class="menu-item">
                <i class="fas fa-file-alt"></i>
                <span>Apply</span>
            </a>

            <a href="{% url 'recent_leave' %}" class="menu-item">
                <i class="fas fa-clock"></i>
                <span>Recent Leave</span>
            </a>

            <a href="{% url 'approve_leave' %}" class="menu-item">
                <i class="fas fa-check"></i>
                <span>Approved Leave</span>
            </a>

            <a href="{% url 'reject_leave' %}" class="menu-item">
                <i class="fas fa-times"></i>
                <span>Rejected Applications</span>
            </a>

            <!-- <a href="{% url 'lapsed_leave' %}" class="menu-item">
                <i class="fas fa-hourglass-half"></i>
                <span>Lapsed Applications</span>
            </a> -->

        </div>
    </div>
</div>

{% endblock body %}
