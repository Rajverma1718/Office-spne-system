{% extends "authentication/root.html" %}
{% load static %}


{% block title %} Swpie Menu {% endblock title %}


{% block head %}
<style>
    /* Swipe Options */
    .main-content {
      padding: 20px;
    }

    .main-content h2 {
      margin-bottom: 15px;
    }

    .main-content a{
        text-decoration: none;
        color: black;
    }

    .menu-item {
      display: flex;
      align-items: center;
      background-color: #f2f2f2;
      border-left: 8px solid orange;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 3px rgba(0, 0, 0, 0.05);
      transition: background-color 0.3s ease;
    }

    .menu-item:hover {
      background-color: #e8e8e8;
    }

    .menu-item i {
      font-size: 24px;
      color: orange;
      margin-right: 10px;
    }

    .menu-item span {
      font-size: 16px;
    }
</style>
{% endblock head %}


{% block body %}

<div class="container" style="margin-top: 150px; margin-bottom: 100px;">
  <div class="main-content">
    <h2>Swipe</h2>
    <a href="{% url 'swipe_apply' %}" class="menu-item"><i class="fas fa-edit"></i><span>Apply</span></a>
    <a href="{% url 'recent_swipe' %}" class="menu-item"><i class="fas fa-clock"></i><span>Recent Swipe</span></a>
    <a href="{% url 'approve_swipe' %}" class="menu-item"><i class="fas fa-check-circle"></i><span>Approved Swipe</span></a>
    <a href="{% url 'reject_swipe' %}" class="menu-item"><i class="fas fa-times-circle"></i><span>Rejected Swipe</span></a>
    <!-- <a href="{% url 'lapsed_swipe' %}" class="menu-item"><i class="fas fa-hourglass-end"></i><span>Lapsed Swipe</span></a> -->
  </div>

</div>

{% endblock body %}
