{% extends "authentication/root.html" %}
{% load static %}

{% block title %} Swipe Apply {% endblock title %}

{% block head %}
<style>

/* ===== PAGE LAYOUT ===== */
.container {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 100px 20px 80px 20px;
    box-sizing: border-box;
}

/* ===== CARD ===== */
.content {
    width: 100%;
    max-width: 950px;
    padding: 50px 60px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
}

/* ===== HEADER ===== */
.main-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.main-content h1 {
    font-size: 28px;
    color: #0b5fa4;
    margin: 0;
    font-weight: 600;
}

.back-btn {
    padding: 9px 20px;
    border: 1px solid #0b5fa4;
    border-radius: 8px;
    background: white;
    font-weight: 600;
    text-decoration: none;
    color: #0b5fa4;
    transition: 0.3s ease;
}

.back-btn:hover {
    background: #0b5fa4;
    color: white;
}

/* ===== FORM ===== */
label {
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
    color: #333;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #dcdcdc;
    font-size: 14px;
    background-color: #f9f9f9;
    transition: 0.3s ease;
    box-sizing: border-box;
    margin-bottom: 20px;
}

input:focus, select:focus, textarea:focus {
    border-color: #0b5fa4;
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(11, 95, 164, 0.1);
}

/* ===== BUTTONS ===== */
.form-buttons {
    display: flex;
    gap: 18px;
    margin-top: 20px;
}

.form-buttons button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

.form-buttons button[type="submit"] {
    background: #0b5fa4;
    color: white;
}

.form-buttons button[type="reset"] {
    background: #888;
    color: white;
}

/* ===== TABLE ===== */
h3 {
    margin-top: 40px;
    font-size: 20px;
    color: #0b5fa4;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background-color: #0b5fa4;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

tr:hover {
    background-color: #f9f9f9;
}

</style>
{% endblock head %}

{% block body %}

<div class="container">
    <div class="content">

        <div class="main-content">
            <h1>Swipe Apply</h1>
            <a href="{% url 'swipe_home' %}" class="back-btn">Back</a>
        </div>

        <!-- 🔹 FORM -->
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-buttons">
                <button type="submit">Save</button>
                <button type="reset">Cancel</button>
            </div>
        </form>

</div>

{% endblock %}
